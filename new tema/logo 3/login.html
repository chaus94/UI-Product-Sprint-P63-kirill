<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Baza-R</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgb(190, 197, 197);
            font-family: "Montserrat", sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            background-color: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin: 0 0 20px;
            text-align: center;
            color: #0b1245;
            font-size: 24px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #333;
        }

        .field input {
            width: 100%;
            padding: 10px 12px;
            background-color: white;
            border: 1px solid gray;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        .field input:focus {
            border-color: #98be2a;
        }

        .submit-btn {
            width: 100%;
            margin-top: 8px;
            padding: 11px;
            border: none;
            border-radius: 10px;
            background-color: #98be2a;
            color: #0b1245;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #86a822;
        }

        .back-link {
            display: block;
            margin-top: 14px;
            text-align: center;
            color: #555;
            font-size: 13px;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <form class="login-card" action="index.html">
        <h1>Вхід</h1>

        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Введіть ваш email" required>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="Введіть пароль" required>
        </div>

        <button type="submit" class="submit-btn">Увійти</button>

        <a href="index.html" class="back-link">← зареструватися</a>
    </form>

</body>
</html>
