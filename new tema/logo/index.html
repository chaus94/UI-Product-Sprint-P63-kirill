<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baza-R</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="site.css">
</head>
<body>
    <header class="site-header">
        <div class="header-action">ТОТАЛЬНИЙ РОЗПРОДАЖ ДО -50%</div>
        <nav class="header-nav" aria-label="Головна навігація">
            <div class="icon-button menu-button" aria-hidden="true">
                <svg viewBox="0 0 18 16" aria-hidden="true">
                    <path d="M1 2h16M1 8h16M1 14h16"/>
                </svg>
            </div>

            <div class="brand" aria-label="Baza-R">
                <img src="logo.png" alt="Baza-R">
            </div>

            <div class="catalog-button" aria-hidden="true">
                <span class="catalog-icon" aria-hidden="true">
                    <svg viewBox="0 0 20 20">
                        <path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z"/>
                    </svg>
                </span>
                <span>Каталог</span>
            </div>

            <div class="search" role="search" aria-label="Пошук товарів">
                <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
                    <circle cx="8.5" cy="8.5" r="5.5"/>
                    <path d="m13 13 4 4"/>
                </svg>
                <span class="search-placeholder">Я шукаю...</span>
                <span class="voice-button" aria-hidden="true">
                    <svg viewBox="0 0 16 20" aria-hidden="true">
                        <rect x="5" y="2" width="6" height="11" rx="3"/>
                        <path d="M3 9a5 5 0 0 0 10 0M8 14v4M5 18h6"/>
                    </svg>
                </span>
                <span class="search-submit">Знайти</span>
            </div>

            <div class="premium-button" aria-hidden="true">
                <span>Спробуйте<br>безкоштовно</span>
                <strong>PREMIUM</strong>
            </div>

            <div class="icon-button account-button" aria-hidden="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <circle cx="12" cy="9" r="3"/>
                    <path d="M6.5 18a6 6 0 0 1 11 0"/>
                </svg>
            </div>

            <div class="icon-button cart-button" aria-hidden="true">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L22 8H6"/>
                    <circle cx="10" cy="20" r="1"/>
                    <circle cx="18" cy="20" r="1"/>
                </svg>
                <span class="cart-count">2</span>
            </div>
        </nav>
    </header>
</body>
</html>
